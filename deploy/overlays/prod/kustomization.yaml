apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: payplan-prod
resources:
  - namespace.yaml
  - ../../base
images:
  - name: ghcr.io/llstrevensll/payplan
    newTag: latest          # lo reescribe el job deploy-prod, pero solo tras aprobación manual
patches:
  # Sin parche de NodePort: en prod el Service queda ClusterIP, como en la base.
  - path: replicas.yaml
